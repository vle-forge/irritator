name: Linux

on:
  push:
    branches: [ master, test ]
  pull_request:
    branches: [ master, test ]

env:
  CC: gcc-11
  CXX: g++-11

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        BUILD_TYPE: [Debug, RelWithDebInfo, Release]

    steps:
    - name: Checkout repository and submodule
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential gcc-11 g++-11 cmake libglew-dev libglfw3-dev libglx0 libopengl0 libgl1-mesa-dev

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{matrix.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -VV -C ${{matrix.BUILD_TYPE}} --rerun-failed --output-on-failure

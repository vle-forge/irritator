stages:
  - build

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  CLICOLOR_FORCE: "1"

# The packages are kept in the project directory to be saved by the runner
# cache between jobs: the mirrors often fail during the downloads.
.build_template:
  stage: build
  variables:
    APT_CACHE_DIR: $CI_PROJECT_DIR/.apt-cache
    DNF_CACHE_DIR: $CI_PROJECT_DIR/.dnf-cache
  cache:
    key: packages-$IMAGE-$COMPILER_PACKAGE
    paths:
      - .apt-cache/
      - .dnf-cache/
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - script_failure
  before_script:
    - |
      if command -v apt-get > /dev/null; then
        mkdir -p $APT_CACHE_DIR/partial
        apt-get -o Acquire::Retries=5 update
        apt-get -o Acquire::Retries=5 -o dir::cache::archives=$APT_CACHE_DIR \
          install -y --no-install-recommends cmake ninja-build libglew-dev libglfw3-dev $COMPILER_PACKAGE
      elif command -v dnf > /dev/null; then
        dnf install -y --setopt=retries=5 --setopt=keepcache=1 --setopt=cachedir=$DNF_CACHE_DIR \
          cmake ninja-build glew-devel glfw-devel $COMPILER_PACKAGE
      fi
  script:
    - mkdir build && cd build
    - cmake -G Ninja -DCMAKE_CXX_COMPILER=$CXX_COMPILER -DCMAKE_C_COMPILER=$C_COMPILER -DCMAKE_CXX_STANDARD=20 ..
    - ninja
    - ctest -V --output-on-failure

linux_matrix:
  extends: .build_template
  parallel:
    matrix:
      - IMAGE: "ubuntu:22.04"
        C_COMPILER: "gcc"
        CXX_COMPILER: "g++"
        COMPILER_PACKAGE: "g++"
      - IMAGE: "ubuntu:24.04"
        C_COMPILER: "clang"
        CXX_COMPILER: "clang++"
        COMPILER_PACKAGE: "clang"
      - IMAGE: "debian:12"
        C_COMPILER: "gcc"
        CXX_COMPILER: "g++"
        COMPILER_PACKAGE: "g++"
      - IMAGE: "fedora:40"
        C_COMPILER: "gcc"
        CXX_COMPILER: "g++"
        COMPILER_PACKAGE: "gcc-c++"
  image: $IMAGE